<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.55" stop-color="#10b981"/>
      <stop offset="1" stop-color="#065f46"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wallet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7f0dd"/>
    </linearGradient>
    <linearGradient id="coin" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#022c22" flood-opacity="0.35"/>
    </filter>
    <filter id="coinShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#064e3b" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <g transform="translate(512 512) scale(1.18) translate(-512 -527) translate(-19,-13)">
    <path d="M300 330 H640 Q700 330 700 372 V400 H300 Z" fill="#a7f3d0" filter="url(#shadow)"/>
    <rect x="232" y="360" width="560" height="390" rx="96" fill="url(#wallet)" filter="url(#shadow)"/>
    <rect x="600" y="480" width="230" height="150" rx="75" fill="#064e3b"/>
    <circle cx="700" cy="555" r="26" fill="#6ee7b7"/>
    <g filter="url(#coinShadow)">
      <circle cx="400" cy="540" r="150" fill="url(#coin)"/>
      <circle cx="400" cy="540" r="120" fill="none" stroke="#b45309" stroke-opacity="0.45" stroke-width="10"/>
      <text x="400" y="540" text-anchor="middle" dominant-baseline="central"
            font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-weight="800" font-size="170" fill="#78350f">$</text>
    </g>
  </g>
</svg>
